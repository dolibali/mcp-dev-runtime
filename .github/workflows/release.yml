name: Precompiled release
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a GitHub draft release after all package checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: precompiled-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64-gnu
          - runner: ubuntu-22.04-arm
            target: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MDR_SIGNING_MODE: skip
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-12 gcc-12 make python3
          echo 'CC=gcc-12' >> "$GITHUB_ENV"
          echo 'CXX=g++-12' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run test:all
      - run: npm run verify:cli
      - run: npm run release:check
      - name: Build pinned self-contained runtime package
        run: npm run release:bundle
      - name: Verify the extracted package without system development tools
        shell: bash
        run: |
          set -euo pipefail
          for archive in artifacts/*.tar.gz; do node scripts/release/verify.mjs "$archive"; done
      - name: Record build provenance (not OS publisher signing)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.target }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.verification.json
          if-no-files-found: error
          compression-level: 0
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
          path: artifacts
      - run: node scripts/release/aggregate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/VERIFICATION.json
          if-no-files-found: error
          compression-level: 0
      - name: Create draft release only after all four packages pass
        if: inputs.create_draft && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --draft --notes-file "docs/releases/v$version.md"
          gh release upload "v$version" artifacts/*.tar.gz artifacts/SHA256SUMS artifacts/VERIFICATION.json
